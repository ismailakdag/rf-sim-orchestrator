[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rf-sim-orchestrator"
version = "0.2.2"
description = "Authenticated, durable host/worker orchestration for independent RF simulation jobs"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "RF simulation workspace"}]
dependencies = []

[project.optional-dependencies]
cst = ["numpy>=2.0", "psutil>=6"]

[project.scripts]
rf-sim = "rfsim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
